<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body { background: #f4f6fb; font-family: Arial, sans-serif; }
        .sidebar { min-height: 100vh; background: #172554; padding: 28px 18px; }
        .brand { color: white; font-size: 25px; font-weight: bold; margin-bottom: 40px; }
        .sidebar a { display: block; color: #dbeafe; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .main-content { padding: 35px; }
        .panel { border: none; border-radius: 14px; padding: 24px; box-shadow: 0 3px 15px rgba(0,0,0,.04); }
        .section-title { color: #172554; font-weight: bold; }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <div class="brand">CourseHub</div>
            <a href="/">Dashboard</a>
            <a href="/courses">Courses</a>
            <a href="/students" class="active">Students</a>
            <a href="/registrations">Registrations</a>
        </aside>

        <main class="col-md-10 main-content">

            <h2 class="section-title">Students</h2>
            <p class="text-muted mb-4">Manage student information and records.</p>

            <div th:if="${successMessage}" class="alert alert-success"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger"
                 th:text="${errorMessage}"></div>

            <div class="card panel mb-4">
                <h5 class="section-title mb-3">Add New Student</h5>

                <form th:action="@{/students}" th:object="${studentRequest}"
                      method="post">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Full Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{name}" required>
                            <small class="text-danger" th:errors="*{name}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control"
                                   th:field="*{email}" required>
                            <small class="text-danger" th:errors="*{email}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Department</label>
                            <input type="text" class="form-control"
                                   th:field="*{department}" required>
                            <small class="text-danger"
                                   th:errors="*{department}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Year of Study</label>
                            <select class="form-select" th:field="*{yearOfStudy}">
                                <option value="1">First Year</option>
                                <option value="2">Second Year</option>
                                <option value="3">Third Year</option>
                                <option value="4">Fourth Year</option>
                            </select>
                            <small class="text-danger"
                                   th:errors="*{yearOfStudy}"></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">
                        Add Student
                    </button>
                </form>
            </div>

            <div class="card panel">
                <h5 class="section-title mb-3">Student Directory</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Department</th>
                            <th>Year</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="student : ${students}">
                            <td th:text="${student.id}"></td>
                            <td th:text="${student.name}"></td>
                            <td th:text="${student.email}"></td>
                            <td th:text="${student.department}"></td>
                            <td th:text="${student.yearOfStudy}"></td>
                            <td>
                                <form th:action="@{/students/{id}/delete(id=${student.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Delete this student?')">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(students)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                No students have been added yet.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <a href="/" class="btn btn-outline-secondary mt-3">
                Back to Dashboard
            </a>

        </main>
    </div>
</div>
</body>
</html>
