<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body { background: #f4f6fb; font-family: Arial, sans-serif; }
        .sidebar { min-height: 100vh; background: #172554; padding: 28px 18px; }
        .brand { color: white; font-size: 25px; font-weight: bold; margin-bottom: 40px; }
        .sidebar a { display: block; color: #dbeafe; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .main-content { padding: 35px; }
        .panel { border: none; border-radius: 14px; padding: 24px; box-shadow: 0 3px 15px rgba(0,0,0,.04); }
        .section-title { color: #172554; font-weight: bold; }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <div class="brand">CourseHub</div>
            <a href="/">Dashboard</a>
            <a href="/courses" class="active">Courses</a>
            <a href="/students">Students</a>
            <a href="/registrations">Registrations</a>
        </aside>

        <main class="col-md-10 main-content">

            <h2 class="section-title">Courses</h2>
            <p class="text-muted mb-4">Create and manage available courses.</p>

            <div th:if="${successMessage}" class="alert alert-success"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger"
                 th:text="${errorMessage}"></div>

            <div class="card panel mb-4">
                <h5 class="section-title mb-3">Add New Course</h5>

                <form th:action="@{/courses}" th:object="${courseRequest}"
                      method="post">

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label">Course Name</label>
                            <input type="text" class="form-control"
                                   th:field="*{name}" required>
                            <small class="text-danger"
                                   th:errors="*{name}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Instructor</label>
                            <input type="text" class="form-control"
                                   th:field="*{instructor}" required>
                            <small class="text-danger"
                                   th:errors="*{instructor}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Category</label>
                            <input type="text" class="form-control"
                                   th:field="*{category}" required>
                            <small class="text-danger"
                                   th:errors="*{category}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Capacity</label>
                            <input type="number" class="form-control"
                                   th:field="*{capacity}" min="1" required>
                            <small class="text-danger"
                                   th:errors="*{capacity}"></small>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Description</label>
                            <textarea class="form-control" rows="2"
                                      th:field="*{description}"></textarea>
                            <small class="text-danger"
                                   th:errors="*{description}"></small>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary mt-3">
                        Add Course
                    </button>
                </form>
            </div>

            <div class="card panel">
                <h5 class="section-title mb-3">Available Courses</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Course</th>
                            <th>Instructor</th>
                            <th>Category</th>
                            <th>Capacity</th>
                            <th>Enrolled</th>
                            <th>Available</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="course : ${courses}">
                            <td th:text="${course.id}"></td>
                            <td>
                                <strong th:text="${course.name}"></strong>
                                <div class="text-muted small"
                                     th:text="${course.description}"></div>
                            </td>
                            <td th:text="${course.instructor}"></td>
                            <td th:text="${course.category}"></td>
                            <td th:text="${course.capacity}"></td>
                            <td th:text="${course.enrolledStudents}"></td>
                            <td th:text="${course.availableSeats}"></td>
                            <td>
                                <form th:action="@{/courses/{id}/delete(id=${course.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Delete this course?')">
                                        Delete
                                    </button>
                                </form>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(courses)}">
                            <td colspan="8" class="text-center text-muted py-4">
                                No courses have been added yet.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <a href="/" class="btn btn-outline-secondary mt-3">
                Back to Dashboard
            </a>

        </main>
    </div>
</div>
</body>
</html>
