<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CourseHub | Registrations</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body { background: #f4f6fb; font-family: Arial, sans-serif; }
        .sidebar { min-height: 100vh; background: #172554; padding: 28px 18px; }
        .brand { color: white; font-size: 25px; font-weight: bold; margin-bottom: 40px; }
        .sidebar a { display: block; color: #dbeafe; text-decoration: none; padding: 12px; border-radius: 8px; margin-bottom: 8px; }
        .sidebar a:hover, .sidebar a.active { background: #2563eb; color: white; }
        .main-content { padding: 35px; }
        .panel { border: none; border-radius: 14px; padding: 24px; box-shadow: 0 3px 15px rgba(0,0,0,.04); }
        .section-title { color: #172554; font-weight: bold; }
    </style>
</head>

<body>
<div class="container-fluid">
    <div class="row">

        <aside class="col-md-2 sidebar">
            <div class="brand">CourseHub</div>
            <a href="/">Dashboard</a>
            <a href="/courses">Courses</a>
            <a href="/students">Students</a>
            <a href="/registrations" class="active">Registrations</a>
        </aside>

        <main class="col-md-10 main-content">

            <h2 class="section-title">Registrations</h2>
            <p class="text-muted mb-4">
                Enroll students in courses and manage their registrations.
            </p>

            <div th:if="${successMessage}" class="alert alert-success"
                 th:text="${successMessage}"></div>
            <div th:if="${errorMessage}" class="alert alert-danger"
                 th:text="${errorMessage}"></div>

            <div class="card panel mb-4">
                <h5 class="section-title mb-3">Register a Student</h5>

                <form th:action="@{/registrations}"
                      th:object="${registrationRequest}" method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Select Student</label>
                            <select class="form-select" th:field="*{studentId}" required>
                                <option value="">Choose a student</option>
                                <option th:each="student : ${students}"
                                        th:value="${student.id}"
                                        th:text="${student.name + ' (' + student.email + ')'}">
                                </option>
                            </select>
                            <small class="text-danger"
                                   th:errors="*{studentId}"></small>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Select Course</label>
                            <select class="form-select" th:field="*{courseId}" required>
                                <option value="">Choose a course</option>
                                <option th:each="course : ${courses}"
                                        th:value="${course.id}"
                                        th:text="${course.name + ' - Available seats: ' + (course.capacity - course.enrolledStudents)}">
                                </option>
                            </select>
                            <small class="text-danger"
                                   th:errors="*{courseId}"></small>
                        </div>

                    </div>

                    <button type="submit" class="btn btn-primary mt-3">
                        Register Student
                    </button>
                </form>
            </div>

            <div class="card panel">
                <h5 class="section-title mb-3">Registration Records</h5>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Student</th>
                            <th>Course</th>
                            <th>Registration Date</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                        </thead>

                        <tbody>
                        <tr th:each="registration : ${registrations}">
                            <td th:text="${registration.id}"></td>
                            <td th:text="${registration.studentName}"></td>
                            <td th:text="${registration.courseName}"></td>
                            <td th:text="${#temporals.format(registration.registrationDate, 'dd MMM yyyy HH:mm')}"></td>
                            <td>
                                <span class="badge"
                                      th:classappend="${registration.status == 'ACTIVE'} ? 'text-bg-success' : 'text-bg-secondary'"
                                      th:text="${registration.status}">
                                </span>
                            </td>
                            <td>
                                <form th:if="${registration.status == 'ACTIVE'}"
                                      th:action="@{/registrations/{id}/cancel(id=${registration.id})}"
                                      method="post">
                                    <button type="submit"
                                            class="btn btn-sm btn-outline-danger"
                                            onclick="return confirm('Cancel this registration?')">
                                        Cancel
                                    </button>
                                </form>
                                <span th:if="${registration.status == 'CANCELLED'}"
                                      class="text-muted small">
                                    No action available
                                </span>
                            </td>
                        </tr>

                        <tr th:if="${#lists.isEmpty(registrations)}">
                            <td colspan="6" class="text-center text-muted py-4">
                                No registrations have been created yet.
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <a href="/" class="btn btn-outline-secondary mt-3">
                Back to Dashboard
            </a>

        </main>
    </div>
</div>
</body>
</html>
